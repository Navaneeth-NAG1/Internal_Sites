name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

jobs:

  # ============================================================
  # BUILD AND DEPLOY
  # ============================================================
  build_and_deploy_job:

    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')

    runs-on: ubuntu-latest

    name: Build and Deploy Job

    steps:

      # --------------------------------------------------------
      # Checkout the GitHub repository
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      # --------------------------------------------------------
      # Deploy the static HTML website
      # --------------------------------------------------------
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1

        with:

          # Azure Static Web Apps deployment token
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_STONE_071DE9410 }}

          # Tell Azure to upload the website
          action: "upload"

          # Your HTML files are in the root of the repository
          app_location: "/"

          # No API
          api_location: ""

          # IMPORTANT:
          # This is a plain HTML/CSS/JS website.
          # Do not run npm/node build commands.
          skip_app_build: true


  # ============================================================
  # CLOSE PULL REQUEST
  # ============================================================
  close_pull_request_job:

    if: github.event_name == 'pull_request' && github.event.action == 'closed'

    runs-on: ubuntu-latest

    name: Close Pull Request Job

    steps:

      - name: Close Pull Request

        id: closepullrequest

        uses: Azure/static-web-apps-deploy@v1

        with:

          action: "close"

          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_STONE_071DE9410 }}
